<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nForce Tools Logo Generator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 2rem;
        }
        .preview-area {
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .preview-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .preview-label {
            font-size: 12px;
            color: #666;
        }
        button {
            background-color: #0070d2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s;
            margin: 5px;
        }
        button:hover {
            background-color: #005fb2;
        }
        .canvas-container {
            display: none; /* Hidden canvases for generation */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>nForce Tools 图标生成器</h1>
        
        <div class="preview-area">
            <!-- Main SVG Logo Design -->
            <div class="preview-item">
                <svg id="master-svg" width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#00A1E0;stop-opacity:1" /> <!-- Salesforce Blue -->
                            <stop offset="100%" style="stop-color:#217346;stop-opacity:1" /> <!-- Excel Green -->
                        </linearGradient>
                        <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
                            <feOffset dx="1" dy="2" result="offsetblur"/>
                            <feComponentTransfer>
                                <feFuncA type="linear" slope="0.3"/>
                            </feComponentTransfer>
                            <feMerge>
                                <feMergeNode/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    
                    <!-- Background -->
                    <rect x="4" y="4" width="120" height="120" rx="24" ry="24" fill="url(#bgGradient)" />
                    
                    <!-- Icon Content: Stylized 'n' with data grid elements -->
                    <g fill="white" filter="url(#dropShadow)">
                        <!-- Left vertical bar of 'n' -->
                        <rect x="32" y="40" width="18" height="60" rx="4" />
                        
                        <!-- Arch of 'n' -->
                        <path d="M 32 58 
                                 Q 32 40, 58 40 
                                 L 96 40 
                                 L 96 58 
                                 L 58 58 
                                 Q 50 58, 50 66 
                                 L 50 100 
                                 L 32 100 
                                 Z" />
                                 
                        <!-- Data blocks on the right (representing Excel cells/data) -->
                        <rect x="60" y="64" width="36" height="10" rx="2" opacity="0.9" />
                        <rect x="60" y="78" width="36" height="10" rx="2" opacity="0.9" />
                        <rect x="60" y="92" width="24" height="8" rx="2" opacity="0.8" />
                    </g>
                </svg>
                <span class="preview-label">128x128 预览</span>
            </div>
        </div>

        <div class="controls">
            <p>点击下方按钮下载不同尺寸的图标，并保存到 <code>icons/</code> 文件夹。</p>
            <button onclick="downloadAll()">一键下载所有尺寸</button>
        </div>
        
        <div class="canvas-container" id="canvas-container"></div>
    </div>

    <script>
        const sizes = [16, 32, 48, 128];
        
        function svgToPng(svgElement, size, callback) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            const svgData = new XMLSerializer().serializeToString(svgElement);
            const img = new Image();
            
            // Create a Blob URL for the SVG
            const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
            const url = URL.createObjectURL(svgBlob);
            
            img.onload = function() {
                ctx.drawImage(img, 0, 0, size, size);
                URL.revokeObjectURL(url);
                callback(canvas.toDataURL('image/png'));
            };
            
            img.src = url;
        }

        function downloadDataUrl(dataUrl, filename) {
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function downloadAll() {
            const svg = document.getElementById('master-svg');
            
            sizes.forEach(size => {
                svgToPng(svg, size, (dataUrl) => {
                    downloadDataUrl(dataUrl, `icon-${size}.png`);
                });
            });
        }
    </script>
</body>
</html>
