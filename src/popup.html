<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nForce Tools</title>
    <link rel="stylesheet" href="lib/css/antd.min.css">
    <!-- 加载共享样式：弹窗以前不引 main.css，自带一套 indigo 主色，
         与主应用的 Ant Design 蓝不同，同一套变量名指向两种颜色 -->
    <link rel="stylesheet" href="lib/css/main.css">
    <style>
        /* 弹窗是 320px 的窄容器，这里只覆盖「尺寸」相关规则。
           颜色 / 字号 / 字族全部复用 main.css :root 的设计令牌。 */
        body {
            width: 320px;
            height: auto;
            min-height: 200px;
            margin: 0;
            padding: 1.5rem;
            background-color: var(--bg-tertiary);
            box-sizing: border-box;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background-color: var(--primary-bg);
            border-radius: 16px;
            margin-bottom: 1rem;
        }
        .icon {
            font-size: var(--icon-xl);
            color: var(--primary-color);
        }
        .title {
            font-size: var(--fs-2xl);
            font-weight: 600;
            margin-bottom: 0.5rem;
            text-align: center;
            color: var(--text-primary);
        }
        .subtitle {
            font-size: var(--fs-base);
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .footer {
            margin-top: 1.5rem;
            font-size: var(--fs-xs);
            color: var(--text-light);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <div class="icon">
                <i class="fas fa-cube"></i>
            </div>
        </div>
        <h1 class="title">nForce Tools</h1>
        <p class="subtitle">Salesforce 数据管理助手</p>
        <button class="ant-btn ant-btn-primary ant-btn-lg" onclick="openFullApp()" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
            <i class="fas fa-external-link-alt"></i>
            <span>打开完整应用</span>
        </button>
        <div class="footer" id="popup-version"></div>
    </div>
    <script>
        function openFullApp() {
            // 打开完整应用页面
            chrome.tabs.create({
                url: chrome.runtime.getURL('index.html'),
                active: true
            });
        }
    </script>
    <script type="module">
        // 图标走共享的 common/icons.js，不再自带一份手写 iconMap
        import { replaceIcons } from './common/icons.js';

        // 版本号唯一来源是 manifest.json。以前这里硬编码 v1.0，
        // 而 manifest 是 3.3.0、package.json 是 3.2.0，三处互不一致。
        const versionEl = document.getElementById('popup-version');
        try {
            versionEl.textContent = 'v' + chrome.runtime.getManifest().version;
        } catch (e) {
            versionEl.textContent = '';
        }

        replaceIcons();
        document.addEventListener('DOMContentLoaded', replaceIcons);
    </script>
</body>
</html>
